name: Build Waraqi Flutter APK from ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'waraqi_flutter_v*.zip'
      - '.github/workflows/build-waraqi-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Extract ZIP without changing source in the repository
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'waraqi_flutter_v*.zip' -printf '%f\n' | sort -V)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo 'ERROR: Upload waraqi_flutter_v1_1_3.zip to the repository ROOT without extracting it.' >&2
            exit 1
          fi
          selected="${zips[$((${#zips[@]} - 1))]}"
          echo "Using $selected"
          unzip -tq "$selected" >/dev/null
          mkdir -p .build_source
          unzip -q "$selected" -d .build_source
          mapfile -t projects < <(find .build_source -maxdepth 3 -name pubspec.yaml -type f | sort)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Flutter pubspec.yaml, found ${#projects[@]}" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "${projects[0]}")" >> "$GITHUB_ENV"

      - name: Generate missing Android scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter create --platforms=android --project-name waraqi_studio --org com.waraqi --no-pub .
          # The default template test would refer to MyApp, not WaraqiApp.
          rm -f test/widget_test.dart
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          test -s assets/tessdata/ara.traineddata
          test -s assets/tessdata/eng.traineddata
          # flutter create can update Android scaffolding; re-check the compatible versions.
          python3 tool/source_preflight.py

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verify Android toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle.kts
          java -version

      - name: Static analysis and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze 2>&1 | tee "$GITHUB_WORKSPACE/flutter-analyze.log"
          flutter test --reporter expanded 2>&1 | tee "$GITHUB_WORKSPACE/flutter-test.log"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --no-pub 2>&1 | tee "$GITHUB_WORKSPACE/flutter-build.log"
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/waraqi-v1.1.3.apk"

      - name: Create verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dist/waraqi-v1.1.3-source.zip" . \
            -x 'build/*' '.dart_tool/*' '.gradle/*' 'android/.gradle/*'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: waraqi-flutter-android-v1.1.3
          path: dist/
          if-no-files-found: error

      - name: Upload diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waraqi-diagnostic-logs-v1.1.3
          path: |
            flutter-analyze.log
            flutter-test.log
            flutter-build.log
          if-no-files-found: ignore
